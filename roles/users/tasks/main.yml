---
- name: Ensure groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ managed_groups }}"

- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    create_home: true
    state: present
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Authorize SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    state: present
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.ssh_key | default('') | length > 0

- name: Grant passwordless sudo (validated with visudo)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.sudo | default(false)

- name: Remove sudoers file for users without sudo
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.sudo | default(false))

- name: Remove unwanted users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ removed_users }}"
